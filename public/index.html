<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ChatGPT Netlify</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat {
      width: 400px;
      height: 600px;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    .user { text-align: right; color: #007aff; }
    .bot { text-align: left; color: #333; }
    input {
      border: none;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="chat">
  <div class="messages" id="messages"></div>
  <input id="input" placeholder="메시지 입력 후 Enter" />
</div>
<script>
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      const text = input.value;
      input.value = "";

      messages.innerHTML += `<div class="user">${text}</div>`;

      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      messages.innerHTML += `<div class="bot">${data.reply}</div>`;
      messages.scrollTop = messages.scrollHeight;
    }
  });
</script>

</body>
</html>
