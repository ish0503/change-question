<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Netlify</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      min-height: 100vh;
    }
    .chat {
      min-height: 100vh;
      height: 100%;
      max-height: 800px;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    .user { text-align: right; color: #007aff; }
    .bot { text-align: left; color: #333; }
    input {
      border: none;
      padding: 10px;
      box-sizing: border-box;
    }
    #input {
      height: 20%;
    }
    .container {
      display: flex;
      gap: 20px; /* 두 영역 사이 간격 */
      justify-content: center;
      align-items: flex-start;
    }

    .system-selector, .chat {
      width: 100%;
      max-width: 500px; /* 동일한 너비로 맞추기 */
    }
    .submit-container {
      margin-top: 10px; /* 버튼과 라디오 선택지 사이 간격 */
      text-align: center; /* 가운데 정렬 */
    }
    p {
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
<!-- 선택창 -->
  <div class="system-selector">
    <h2>Select a System</h2>
    <form id="systemForm">
      <label>
        <input type="radio" name="system" value="blank"> Blank
      </label>
      <br>
      <label>
        <input type="radio" name="system" value="grammer"> Grammer
      </label>
      <br>
      <label>
        <input type="radio" name="system" value="meaning"> Meaning
      </label>
      <br>
      <label>
        <input type="radio" name="system" value="order"> Order
      </label>
      <div class="submit-container">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>

<!-- 채팅창 -->
<div class="chat">
  <div class="messages" id="messages"></div>
  <textarea name="" id="input" placeholder="메시지 입력 후 Enter" style="font-size:10px;"></textarea>
</div>
</div>

<script>
  // 채팅창 스크립트
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      e.preventDefault()
      if (!input.value.trim()){
        return
      }
      const selected = document.querySelector('input[name="system"]:checked');

      if (!selected) {
        alert("문제 유형을 선택하고 submit을 누른 뒤 본문을 보내세요.");
        return;
      }
      const text = input.value;
      input.value = "";

      messages.innerHTML += `<div class="user"><p style="font-size:10px; white-space: pre-wrap; ">${text}</p></div>`;

      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        body: JSON.stringify({ 
          typesystem: selected.value,
          message: text 
        })
      });

      const data = await res.json();
      messages.innerHTML += `<div class="bot"><p style="font-size:10px; white-space: pre-wrap; ">${data.reply}</p></div>`;
      messages.scrollTop = messages.scrollHeight;
    }
  });
</script>

  <script>
    // 선택창 스크립트
    const form = document.getElementById("systemForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); // 폼 기본 제출 방지

      const selected = document.querySelector('input[name="system"]:checked');

      if (!selected) {
        alert("문제유형을 선택하고 submit을 눌러주세요.");
        return;
      }

      console.log("Selected system:", selected.value);
      alert("You selected: " + selected.value);
    });
  </script>
</body>

</html>
